<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Квиз по Гарри Поттеру</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/*
VOICE   торжественно и празднично, как пир в Большом зале
IDEA    зачарованный потолок ночного неба над замком
PICTURE силуэт замка под звёздами; плитки ответов в цветах факультетов
COLOUR  ночь #120e1f, золото #e0b25a, пергамент #f3e6c8, четыре цвета факультетов
TYPE    Cormorant Garamond для заголовков, Manrope для текста
*/
:root{--night:#120e1f;--gold:#e0b25a;--gold2:#f6d58d;--parch:#f3e6c8;--ink:#f4ecdc;--muted:#b9aecb;
  --gryffindor:#b3262f;--slytherin:#1d7a4c;--ravenclaw:#2557a7;--hufflepuff:#d89a1d;
  --a0:#b3262f;--a1:#1d7a4c;--a2:#2557a7;--a3:#d89a1d;
  --title:"Cormorant Garamond",Georgia,serif;--body:Manrope,"Segoe UI",Roboto,system-ui,sans-serif;color-scheme:dark}
:root[data-theme=light],:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;min-height:100%}
body{background:var(--night);color:var(--ink);font:16px/1.5 var(--body);overflow-x:clip;-webkit-tap-highlight-color:transparent}
.sky{position:fixed;inset:0;z-index:-1;background:radial-gradient(120% 80% at 50% 110%,#3a1530 0%,transparent 60%),radial-gradient(90% 60% at 80% -10%,#2a2150 0%,transparent 60%),linear-gradient(#0c0a16,#151026 60%,#1d1430)}
.sky canvas{position:absolute;inset:0;width:100%;height:100%}
.castle{position:absolute;left:0;right:0;bottom:0;width:100%;height:30vh;opacity:.7}
h1,h2{font-family:var(--title);font-weight:700;line-height:1.05;margin:0;text-wrap:balance}
button{font:inherit;color:inherit;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold2);outline-offset:3px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;min-height:48px;padding:.7em 1.4em;border-radius:999px;background:linear-gradient(#f2cd7c,#c8913a);color:#2b1806;font-weight:800;box-shadow:0 1px 0 #fff6 inset,0 6px 20px #e0b25a40;transition:transform .15s,filter .15s}
.btn:hover{filter:brightness(1.07)}.btn:active{transform:scale(.97)}.btn[disabled]{filter:grayscale(.8) brightness(.7);cursor:not-allowed}
.btn.ghost{background:#ffffff14;color:var(--ink);box-shadow:inset 0 0 0 1px #ffffff2a}
.gold{color:var(--gold)}.muted{color:var(--muted)}
.dot{display:inline-block;width:.8em;height:.8em;border-radius:50%;flex:none}
.shape{width:1em;height:1em;flex:none;fill:currentColor}
.ans0{background:var(--a0)}.ans1{background:var(--a1)}.ans2{background:var(--a2)}.ans3{background:var(--a3);color:#2a1700}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
@keyframes rise{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
/* общие */
.msg{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}
.msg h1{font-size:clamp(34px,6vw,64px);color:var(--parch);margin-bottom:.3em}
.msg h1 em{font-style:normal;color:var(--gold)}
.choose{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:24px}
.choose .btn{min-height:64px;font-size:19px;padding:.8em 1.8em}
/* ЭКРАН */
.scr{font-size:clamp(15px,1.15vw,22px);min-height:100vh;display:flex;flex-direction:column;padding:clamp(18px,3vw,56px) clamp(18px,4vw,72px) clamp(84px,10vh,110px)}
.lobby{flex:1;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:clamp(20px,4vw,72px);align-items:center}
.lobby h1{font-size:clamp(44px,5.4vw,104px);color:var(--parch)}.lobby h1 em{font-style:normal;color:var(--gold)}
.sub{margin:.6em 0 1.4em;font-size:1.1em;color:var(--muted)}
.join{display:flex;gap:1.3em;align-items:center;background:linear-gradient(160deg,#f6ead0,#e8d5aa);color:#2a1b10;border-radius:22px;padding:1.1em;box-shadow:0 20px 60px #0008;max-width:44em}
.qr{width:clamp(130px,13vw,250px);aspect-ratio:1;background:#fff;border-radius:12px;padding:8px;flex:none}
.qr svg{width:100%;height:100%;display:block}
.url{font-weight:800;font-size:.9em;margin:.4em 0;overflow-wrap:anywhere;opacity:.8}
.hall{align-self:stretch;display:flex;flex-direction:column;background:#1a1429d9;border:1px solid #ffffff1f;border-radius:26px;padding:clamp(16px,2vw,32px)}
.hall h2{font-size:clamp(26px,2.4vw,46px)}.hall h2 b{color:var(--gold)}
.cloud{flex:1;display:flex;flex-wrap:wrap;align-content:flex-start;gap:.55em;margin:1em 0;min-height:28vh}
.chip{display:inline-flex;align-items:center;gap:.5em;padding:.45em .9em .45em .55em;border-radius:999px;background:#ffffff12;font-weight:700}
.chip.new{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}.chip.off{opacity:.4}
.empty{color:var(--muted);font-style:italic}
.mini{display:flex;gap:1.1em;flex-wrap:wrap;color:var(--muted)}.mini span{display:inline-flex;align-items:center;gap:.4em}
.qwrap{flex:1;display:flex;flex-direction:column;gap:clamp(14px,2.2vh,30px)}
.qhead{display:flex;justify-content:space-between;gap:1em;font-weight:800;font-size:1.1em}
.qnum{color:var(--gold)}.answered b{font-size:1.5em;color:var(--parch)}
.qmain{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:clamp(18px,3vw,56px);align-items:center;flex:1}
.timer{width:clamp(110px,11vw,200px);aspect-ratio:1;position:relative}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer .num{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--title);font-weight:700;font-size:clamp(44px,4.6vw,88px)}
.timer.low .num{color:#ff6b6b}
.qtext{font-size:clamp(32px,3.9vw,76px);color:var(--parch);animation:rise .5s}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(10px,1.2vw,22px)}
.tile{position:relative;overflow:hidden;display:flex;align-items:center;gap:.8em;min-height:clamp(70px,11vh,130px);padding:.6em 1.1em;border-radius:18px;font-weight:800;font-size:clamp(20px,2vw,40px);line-height:1.15;box-shadow:0 10px 30px #0006,inset 0 1px 0 #fff3;transition:transform .4s,filter .4s;animation:rise .45s backwards}
.tile:nth-child(2){animation-delay:.07s}.tile:nth-child(3){animation-delay:.14s}.tile:nth-child(4){animation-delay:.21s}
.tile .shape{font-size:1.25em}.tile .txt{flex:1}
.tile .bar{position:absolute;left:0;bottom:0;height:8px;background:#fff8;width:0;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.tile .cnt{font-family:var(--title);font-size:1.3em;display:none}
.reveal .tile .cnt{display:block}
.reveal .tile.wrong{filter:grayscale(.55) brightness(.42);transform:scale(.97)}
.reveal .tile.right{box-shadow:0 0 0 4px var(--gold2),0 0 60px #f6d58d88}
.fact{font-size:1.15em;color:var(--parch);background:#1d1730;box-shadow:0 10px 30px #0006;border-left:4px solid var(--gold);padding:.7em 1em;border-radius:0 12px 12px 0;animation:rise .5s .3s backwards}
.strip{display:flex;flex-wrap:wrap;gap:.4em;min-height:2.2em}.strip .chip{font-size:.9em;animation:pop .4s}
.board{flex:1;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:clamp(20px,4vw,64px);align-items:start}
.board h1{font-size:clamp(40px,4.4vw,84px);color:var(--parch);margin-bottom:.4em}.board h2{font-size:clamp(28px,2.6vw,50px);margin-bottom:.6em}
.lb{list-style:none;margin:0;padding:0;display:grid;gap:.55em}
.row{display:grid;grid-template-columns:2.4em auto minmax(0,1fr) auto auto;align-items:center;gap:.8em;padding:.55em 1em;border-radius:14px;background:#ffffff10;font-size:1.25em;font-weight:700;transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.row:first-child{background:linear-gradient(90deg,#e0b25a40,#ffffff10)}
.row .r{font-family:var(--title);font-size:1.4em;color:var(--gold);text-align:center}
.row .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row .g{color:#8be3a8;font-size:.85em;white-space:nowrap}
.row .s{font-variant-numeric:tabular-nums;text-align:right;min-width:4.5em}
.mv{font-size:.75em;margin-left:.4em}.mv.up{color:#8be3a8}.mv.dn{color:#ff8a8a}
.cup{display:grid;gap:1em}.hrow{display:grid;gap:.35em}.hrow .hn{display:flex;justify-content:space-between;font-weight:800;font-size:1.1em}
.hbar{height:22px;border-radius:999px;background:#ffffff14;overflow:hidden}.hbar i{display:block;height:100%;border-radius:inherit;width:0;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.final{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;gap:1.2em}
.final h1{font-size:clamp(44px,5.2vw,104px);color:var(--parch)}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:end;gap:clamp(10px,2vw,30px);width:min(1100px,100%);margin-top:auto}
.pod{display:flex;flex-direction:column;align-items:center;gap:.4em;animation:rise .8s backwards}
.pod .nm{font-weight:800;font-size:clamp(20px,2vw,40px);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .sc{color:var(--muted);font-weight:700}
.pod .blk{width:100%;border-radius:18px 18px 0 0;display:grid;place-items:start center;padding-top:.3em;font-family:var(--title);font-size:clamp(50px,6vw,120px);font-weight:700;color:#2a1700;background:linear-gradient(#f6d58d,#b8822f)}
.pod.p2 .blk{background:linear-gradient(#e9e9f2,#9a9ab0);height:20vh}.pod.p1 .blk{height:30vh}.pod.p1{animation-delay:.6s}
.pod.p3 .blk{background:linear-gradient(#e7b089,#9c5b32);height:13vh}.pod.p3{animation-delay:.2s}
.ctrl{position:fixed;right:clamp(12px,2vw,32px);bottom:clamp(12px,2vh,28px);display:flex;gap:.6em;z-index:5;flex-wrap:wrap;justify-content:flex-end}
.ctrl .btn{min-height:54px}
.status{position:fixed;left:clamp(12px,2vw,32px);bottom:clamp(14px,2vh,30px);color:var(--muted);font-size:.9em;display:flex;align-items:center;gap:.5em;z-index:5}
.status i{width:.6em;height:.6em;border-radius:50%;background:#58d68d}.status.off i{background:#ff6b6b}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:6;width:100%;height:100%}
@media(max-width:900px){.lobby,.board{grid-template-columns:1fr}.qmain{grid-template-columns:1fr;justify-items:center;text-align:center}.join{flex-direction:column;text-align:center}}
@media(max-width:600px){.tiles{grid-template-columns:1fr}.row{grid-template-columns:2em auto minmax(0,1fr) auto}.row .g{display:none}.ctrl .btn.ghost{display:none}}
/* ТЕЛЕФОН */
.ply{min-height:100dvh;display:flex;flex-direction:column;padding:16px;max-width:560px;margin:0 auto;user-select:none}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700;color:var(--muted);font-size:14px;min-height:28px}
.me{display:inline-flex;align-items:center;gap:6px;color:var(--ink);max-width:60%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.center{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px;text-align:center;animation:rise .4s}
.ply h1{font-size:clamp(32px,10vw,46px);color:var(--parch)}.ply h1 em{font-style:normal;color:var(--gold)}
.lead{color:var(--muted);font-size:17px;margin:0}
form{display:flex;flex-direction:column;gap:16px;text-align:left}
label{font-weight:700;font-size:14px;color:var(--muted)}
input{width:100%;font:700 18px var(--body);padding:14px 16px;border-radius:14px;border:1px solid #ffffff2a;background:#ffffff10;color:var(--ink)}
input::placeholder{color:#ffffff55}
.houses{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.house{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:14px;border-radius:16px;background:#ffffff0d;box-shadow:inset 0 0 0 1px #ffffff20;text-align:left;font-weight:800;min-height:84px}
.house svg{width:28px;height:28px}.house small{font-weight:500;color:var(--muted);font-size:12px}
.house[aria-pressed=true]{background:color-mix(in srgb,var(--c) 45%,transparent);box-shadow:inset 0 0 0 2px var(--c)}
.err{color:#ff8a8a;min-height:1.2em;margin:0;font-size:14px}
.big{width:100%;min-height:56px;font-size:18px}
.timebar{height:8px;border-radius:999px;background:#ffffff18;overflow:hidden;margin:10px 0 14px}
.timebar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));width:100%}
.qt{font-family:var(--title);font-weight:700;font-size:clamp(22px,6.4vw,30px);line-height:1.15;color:var(--parch);margin:0 0 14px}
.grid{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:10px;min-height:52dvh}
.opt{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:12px;border-radius:18px;font-weight:800;font-size:clamp(18px,5.4vw,24px);line-height:1.2;box-shadow:0 8px 20px #0006,inset 0 1px 0 #fff3}
.opt .shape{font-size:34px}.opt:active{transform:scale(.95)}
.opt.picked{box-shadow:0 0 0 4px var(--gold2),0 8px 30px #0008}
.res{border-radius:24px;padding:28px 18px;box-shadow:0 20px 50px #0008}
.res.ok{background:linear-gradient(160deg,#2ea36a,#145c3b)}.res.bad{background:linear-gradient(160deg,#c23a43,#6e1424)}.res.none{background:linear-gradient(160deg,#4a4160,#241d36)}
.res h1{color:#fff}.res .pts{font-family:var(--title);font-weight:700;font-size:clamp(44px,14vw,70px);color:#fff;animation:pop .6s}
.res p{margin:.4em 0 0;color:#ffffffd0}
.rank{font-family:var(--title);font-weight:700;font-size:clamp(80px,28vw,140px);line-height:1;color:var(--gold);animation:pop .7s}
.score{font-size:20px;font-weight:800;margin:0}
.wand{width:88px;height:88px;margin:0 auto}.wand .spark{transform-origin:70px 18px;animation:spin 2.4s linear infinite}
.link{background:none;color:var(--muted);text-decoration:underline;font-size:14px;padding:10px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.f1{fill:#f2c25e}.f2{fill:#e8d8b4}.f3{fill:#2a1f40}.win{fill:#f6d58d}.ln{fill:none;stroke:#e8d8b4;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.ln.dk{stroke:#3a2c55}
.qpic{width:clamp(110px,15vw,280px);height:auto;filter:drop-shadow(0 16px 40px #000a);animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
.ppic{width:76px;height:76px;display:block;margin:0 auto 10px;filter:drop-shadow(0 8px 20px #0009)}
.count{display:flex;align-items:center;gap:.5em;flex-wrap:wrap;margin:-.6em 0 1.4em;color:var(--muted);font-weight:700}
.count button{min-height:44px;padding:.4em 1em;border-radius:999px;background:#ffffff12;box-shadow:inset 0 0 0 1px #ffffff2a;font-weight:800}
.count button[aria-pressed=true]{background:var(--gold);color:#2b1806;box-shadow:none}
#tsel{margin:0 0 .7em}
@media(max-width:900px){.qpic{display:none}}
.fx{position:fixed;inset:0;pointer-events:none;z-index:8;overflow:hidden}
.patronus{position:absolute;left:0;top:0;width:min(40vw,540px);color:#dff3ff;opacity:.9;filter:drop-shadow(0 0 8px #a8dcff) drop-shadow(0 0 30px #59b4ff);animation:patfly 2.6s cubic-bezier(.45,.05,.55,.95) forwards}
.patronus svg{width:100%;height:auto;display:block}
.patronus span{position:absolute;left:50%;bottom:-.6em;transform:translateX(-50%);font-family:var(--title);font-weight:700;font-size:clamp(18px,1.8vw,32px);color:#e8f6ff;white-space:nowrap;opacity:.85}
@keyframes patfly{0%{transform:translate(-45vw,var(--y0)) scale(.8);opacity:0}15%{opacity:.95}50%{transform:translate(30vw,calc((var(--y0) + var(--y1)) / 2)) scale(1)}85%{opacity:.9}100%{transform:translate(110vw,var(--y1)) scale(.9);opacity:0}}
.spark{position:fixed;width:6px;height:6px;border-radius:50%;background:#e6f6ff;box-shadow:0 0 10px #8fd0ff;animation:sparkfade 1.3s forwards}
@keyframes sparkfade{to{transform:translateY(24px) scale(.2);opacity:0}}
.hx{position:fixed;inset:0;z-index:9;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--hc) 70%,#000) 0%,#07050df2 72%);animation:hxin .6s ease-out;cursor:pointer}
.hx.out{animation:hxout .9s forwards}
@keyframes hxin{from{opacity:0}}@keyframes hxout{to{opacity:0;transform:scale(1.05)}}
.hx-rays{position:absolute;inset:-50%;background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--hl) 22%,transparent) 0 6deg,transparent 6deg 18deg);animation:spin 40s linear infinite;-webkit-mask:radial-gradient(circle,#000 0,transparent 55%);mask:radial-gradient(circle,#000 0,transparent 55%)}
.hx-stage{position:relative;width:min(56vw,62vh);display:grid;place-items:center;margin-bottom:12vh}
.hx-slytherin .hx-stage{width:min(92vw,1200px)}.hx-hufflepuff .hx-stage{width:min(80vw,960px)}
.hx-svg{width:100%;height:auto;overflow:visible;filter:drop-shadow(0 20px 50px #000c) drop-shadow(0 0 40px color-mix(in srgb,var(--hl) 55%,transparent))}
.hx-text{position:absolute;bottom:5vh;left:0;right:0;text-align:center;font-family:var(--title);font-weight:700;color:#fff;animation:rise .8s 1s backwards}
.hx-text small{display:block;font-size:clamp(18px,2vw,34px);opacity:.85}
.hx-text b{font-size:clamp(48px,7vw,130px);line-height:1;color:var(--hl);text-shadow:0 4px 30px #000}
.lion{animation:lionIn 1.2s cubic-bezier(.2,1.4,.4,1) both}.lion .mane{transform-origin:100px 104px;animation:maneRoar 1.4s 1.1s ease-in-out}.lion .jaw{transform-origin:100px 136px;animation:jaw 1.4s 1.1s}
@keyframes lionIn{from{transform:translateY(60vh) scale(.3)}}@keyframes maneRoar{30%,60%{transform:scale(1.12) rotate(4deg)}45%{transform:scale(1.1) rotate(-4deg)}}@keyframes jaw{30%,70%{transform:scaleY(1.9)}}
.eagle{animation:eagleIn 1.4s cubic-bezier(.3,.9,.3,1) both}.eagle .wl,.eagle .wr{transform-origin:100px 92px;animation:flap .45s ease-in-out 7 alternate}
@keyframes eagleIn{from{transform:translate(60vw,-70vh) scale(.4) rotate(-20deg)}}@keyframes flap{to{transform:scaleY(.5)}}
.badger{animation:badgerIn 1.6s ease-out both}.badger .bb{animation:hop .25s ease-in-out 8 alternate}
@keyframes badgerIn{from{transform:translateX(80vw)}}@keyframes hop{to{transform:translateY(-8px)}}
.fx2{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:10}
.fx2-name{position:fixed;left:0;right:0;top:4vh;text-align:center;z-index:11;pointer-events:none;font-family:var(--title);font-weight:700;font-size:clamp(22px,2.4vw,44px);color:#e8f6ff;text-shadow:0 0 18px #6fbfff;opacity:0}
.fx2-name.on{animation:nameFade 3.2s ease-in-out}
@keyframes nameFade{15%,75%{opacity:1}100%{opacity:0}}
.candles{position:fixed;inset:0 0 auto 0;height:46vh;pointer-events:none;z-index:0}
.candle{position:absolute;width:10px;height:44px;border-radius:3px;background:linear-gradient(90deg,#d9cdb4,#fff6e0 45%,#bfb196);animation:bob 6s ease-in-out infinite;opacity:.7}
.candle::before{content:"";position:absolute;left:50%;top:-16px;width:10px;height:18px;margin-left:-5px;border-radius:50% 50% 45% 45%/60% 60% 40% 40%;background:radial-gradient(circle at 50% 70%,#fff 0,#ffe28a 35%,#ff9a2a 70%,transparent 72%);filter:drop-shadow(0 0 8px #ffb347) drop-shadow(0 0 22px #ff8a1a);animation:flick .18s ease-in-out infinite alternate;transform-origin:50% 100%}
.candle::after{content:"";position:absolute;left:50%;top:-40px;width:80px;height:80px;margin-left:-40px;border-radius:50%;background:radial-gradient(circle,#ffb34733,transparent 65%)}
@keyframes bob{50%{transform:translateY(-14px)}}@keyframes flick{to{transform:scale(.9,1.08) skewX(3deg)}}
.scr{position:relative;z-index:1}
.scr>section{animation:secIn .7s cubic-bezier(.2,.8,.2,1)}
@keyframes secIn{from{opacity:0;transform:translateY(18px) scale(.985);filter:blur(6px)}}
.qtext{animation:qin 1s cubic-bezier(.2,.8,.2,1) .15s backwards}

function syncPeers(){
  if(!room)return;const here=new Set();
  for(const p of room.peers()){
    if(p.kind!=='viewer'||p.sameTab)continue;const pr=p.presence||{};
    const pid=typeof pr.pid==='string'?pr.pid.slice(0,20):'';const name=cleanName(pr.name);
    if(!pid||!name)continue;here.add(pid);
    let pl=G.players[pid];
    if(!pl)pl=G.players[pid]={pid,name,house:'gryffindor',score:0,answers:{},joined:Date.now(),prev:null};
    pl.name=name;if(HOUSES.includes(pr.house))pl.house=pr.house;
    const a=pr.a;
    if(G.ph==='question'&&!G.paused&&a&&a.e===G.e&&a.q===G.qi&&!pl.answers[G.qi]&&[0,1,2,3].includes(a.c)){
      const el=Date.now()-G.qStart;const ms=Math.max(0,Math.min(Number(a.ms)||el,el,TIME));
      pl.answers[G.qi]={c:a.c,pts:a.c===QS[G.qi].c?Math.round(1000*(1-ms/TIME/2)):0};
    }
  }
  for(const pl of Object.values(G.players))pl.on=here.has(pl.pid);
  if(G.ph==='question'){const on=Object.values(G.players).filter(p=>p.on);
    if(on.length&&on.every(p=>p.answers[G.qi])){clearTimeout(G.timer);G.timer=setTimeout(reveal,700)}}
  publish();
}
window.__hpq={get G(){return G},QS,startQ:i=>startQ(i)};
function togglePause(){if(G.ph!=='question')return;if(!G.paused){clearTimeout(G.timer);G.pauseLeft=Math.max(0,G.qStart+TIME-Date.now());G.paused=true}else{G.paused=false;G.qStart=Date.now()-(TIME-G.pauseLeft);G.timer=setTimeout(reveal,G.pauseLeft+300)}publish(true)}
function startQ(i){G.paused=false;clearTimeout(G.timer);ranked().forEach((p,k)=>p.prev=k+1);G.ph='question';G.pos=i;G.qi=G.order[i];G.qStart=Date.now();G.timer=setTimeout(reveal,TIME+300);publish(true)}
function reveal(){if(G.ph!=='question')return;clearTimeout(G.timer);for(const p of Object.values(G.players)){const a=p.answers[G.qi];if(a)p.score+=a.pts}G.ph='reveal';publish(true)}
function next(){
  if(G.paused)togglePause();
  if(G.ph==='lobby'){const P=shuffle(QS.map((q,i)=>q.pic?i:-1).filter(i=>i>=0)),T=shuffle(QS.map((q,i)=>q.pic?-1:i).filter(i=>i>=0));
    if(G.count==='frames')G.order=P;else{const mix=[];while(T.length||P.length){if(T.length)mix.push(T.shift());if(P.length)mix.push(P.shift())}G.order=mix.slice(0,G.count==='all'?mix.length:Math.min(G.count,mix.length))}startQ(0)}
  else if(G.ph==='question')reveal();
  else if(G.ph==='reveal'){G.ph='board';publish(true)}
  else if(G.ph==='board'){if(G.pos+1<G.order.length)startQ(G.pos+1);else{G.ph='final';publish(true)}}
  else if(G.ph==='final'){for(const p of Object.values(G.players)){p.score=0;p.answers={};p.prev=null}G.e=Date.now();G.ph='lobby';G.qi=-1;G.pos=-1;G.order=[];publish(true)}
}
function viewState(){
  const list=ranked();
  const pl=list.map((p,k)=>{const a=p.answers[G.qi];return [p.pid,p.name,p.house,p.score,p.prev||0,a&&G.ph!=='question'?a.pts:0,a?1:0,p.on?1:0]});
  const h={};for(const x of HOUSES)h[x]=[0,0];for(const p of list){h[p.house][0]+=p.score;h[p.house][1]++}
  let cnt=null;if(G.ph!=='question'&&G.qi>=0){cnt=[0,0,0,0];for(const p of list){const a=p.answers[G.qi];if(a)cnt[a.c]++}}
  const v={T:TIME,e:G.e,ph:G.ph,qi:G.qi,pos:G.pos,tot:G.order.length||G.count,rem:G.ph==='question'?(G.paused?G.pauseLeft:Math.max(0,G.qStart+TIME-Date.now())):0,pz:G.paused?1:0,n:list.length,cnt,h,pl};
  while(JSON.stringify(v).length>3800&&v.pl.length>5)v.pl.pop();
  return v;
}

    <div><label for="nm">Как тебя зовут?</label><input id="nm" maxlength="18" autocomplete="nickname" placeholder="Например, Гермиона" value="${esc(me.name)}"></div>
    <div><label>Выбери факультет</label><div class="houses">${HOUSES.map(h=>`<button type="button" class="house" data-h="${h}" aria-pressed="${h===me.house}" style="--c:var(--${h})"><svg viewBox="0 0 24 24"><path d="${CREST}" fill="var(--${h})" stroke="#fff6"/></svg>${HN[h]}<small>${HD[h]}</small></button>`).join('')}</div></div>
    <p class="err" id="err"></p><button class="btn big" type="submit">Войти в Большой зал</button></form></div>`;
  let house=me.house;
  el.querySelectorAll('.house').forEach(b=>b.onclick=()=>{house=b.dataset.h;el.querySelectorAll('.house').forEach(x=>x.setAttribute('aria-pressed',x===b))});
  document.getElementById('f').onsubmit=e=>{e.preventDefault();const n=cleanName(document.getElementById('nm').value),err=document.getElementById('err');
    if(!n){err.textContent='Напиши имя';return}if(!house){err.textContent='Выбери факультет';return}
    me={name:n,house};store.set('hpq-name',n);store.set('hpq-house',house);editing=false;pkey='';
    room.presence({pid:PID,name:n,house,a:null}).catch(()=>{});if(V)playRender(V);else waitHost()};
}
function topBar(p){return `<div class="top"><span class="me"><i class="dot" style="background:var(--${me.house})"></i>${esc(me.name)}</span><span>${p?p.score:0} очков</span></div>`}
const WAND=`<svg class="wand" viewBox="0 0 88 88"><path d="M14 76 66 24" stroke="#c9a36a" stroke-width="6" stroke-linecap="round"/><g class="spark" fill="var(--gold2)"><circle cx="70" cy="6" r="3"/><circle cx="82" cy="18" r="2.4"/><circle cx="70" cy="30" r="2"/><circle cx="58" cy="18" r="2.6"/></g></svg>`;
function playRender(v){
  const el=document.getElementById('ply');if(!el||editing)return;
  const pl=P(v),p=pl.find(x=>x.pid===PID),m=mine();
  const k=[v.ph,v.qi,v.e,m!=null?1:0,v.rem>0?1:0,v.ph==='lobby'||v.ph==='board'?v.n+':'+(p?p.rank:0):''].join(':');
  if(k===pkey)return;pkey=k;
  if(v.ph==='lobby'){
    el.innerHTML=`${topBar(p)}<div class="center">${WAND}<h1>Ты в игре, <em>${esc(me.name)}</em>!</h1><p class="lead">Смотри на большой экран. Ведущий скоро начнёт.<br>В зале: ${v.n}.</p><button class="link" id="edit">Сменить имя или факультет</button></div>`;
    document.getElementById('edit').onclick=()=>{editing=true;joinView()};
  }else if(v.ph==='question'){
    const q=QS[v.qi];
    if(m==null&&v.rem>0&&Date.now()<deadline){
      el.innerHTML=`${topBar(p)}<div class="timebar"><i id="tb"></i></div>${q.model?`<div class="pframe qmodel" data-model="${q.model}" style="background-image:url(${q.pic})"></div>`:q.pic?`<img class="pframe" src="${q.pic}" alt="">`:q.dragon?`<div class="qdragon pdragon" data-dragon="${q.dragon}"></div>`:iconSVG(q.img,'ppic')}<p class="qt">${esc(q.q)}</p><div class="grid">${q.a.map((a,i)=>`<button class="opt ans${i}" data-i="${i}">${shape(i)}<span>${esc(a)}</span></button>`).join('')}</div>`;
      el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(v,+b.dataset.i));
      if(window.__fxQ!==v.e+':'+v.qi){window.__fxQ=v.e+':'+v.qi;window.__fxQText=q.q;if(typeof patronusFly==='function')setTimeout(patronusFly,60)}
    }else if(m==null){el.innerHTML=`${topBar(p)}<div class="center"><div class="res none"><h1>Время вышло</h1><p>Смотри ответ на экране</p></div></div>`}
    else el.innerHTML=`${topBar(p)}<div class="center">${WAND}<h1>Ответ принят</h1><div class="opt ans${m} picked" style="min-height:90px">${shape(m)}<span>${esc(q.a[m])}</span></div><p class="lead">Ждём остальных волшебников…</p></div>`;
  }else if(v.ph==='reveal'){
    const q=QS[v.qi],ok=m!=null&&m===q.c;if(window.FX3D&&FX3D.ready)FX3D.clear();
    el.innerHTML=`${topBar(p)}<div class="center rv"><div class="res ${m==null?'none':ok?'ok':'bad'}"><h1>${m==null?'Нет ответа':ok?'Верно!':'Мимо'}</h1>${ok?`<div class="pts">+${p?p.gain:''}</div>`:''}</div>
      <p class="qt small">${esc(q.q)}</p>
      <div class="rlist">${q.a.map((a,i)=>`<div class="ropt ans${i}${i===q.c?' right':''}${i===m&&i!==q.c?' mine':''}">${shape(i)}<span>${esc(a)}</span>${i===q.c?'<b class="tick">✓ Правильно</b>':i===m?'<b class="tick x">✗ Твой ответ</b>':''}</div>`).join('')}</div>
      ${p?`<p class="score">Ты на ${p.rank} месте из ${v.n}</p>`:''}</div>`;
    try{navigator.vibrate&&navigator.vibrate(ok?[60,40,60]:200)}catch(e){}
    if(ok)setTimeout(()=>{const r=el.querySelector('.res');if(r&&typeof FX2!=='undefined'){const b=r.getBoundingClientRect();FX2.burst(b.left+b.width/2,b.top+b.height/2,'#8be3a8',70)}},150);
  }else if(v.ph==='board'){
    el.innerHTML=`${topBar(p)}<div class="center"><p class="lead">Твоё место</p><div class="rank">${p?p.rank:'—'}</div><p class="score">${p?p.score:0} очков · игроков: ${v.n}</p><p class="lead">${p&&p.rank===1?'Ты лидируешь! Не сбавляй темп.':'Смотри таблицу на большом экране'}</p></div>`;
  }else if(v.ph==='final'){
    const H=topHouse(v.h),r=p?p.rank:0;
    el.innerHTML=`${topBar(p)}<div class="center"><h1>${r===1?'Ты чемпион турнира!':r&&r<=3?'Ты на пьедестале!':'Отличная игра!'}</h1><div class="rank">${r||'—'}</div><p class="score">место из ${v.n} · ${p?p.score:0} очков</p>${H?`<p class="lead">Кубок факультетов: <b style="color:${light(H)}">${HN[H]}</b>${H===me.house?' — это твой факультет!':''}</p>`:''}</div>`;
    try{navigator.vibrate&&navigator.vibrate([80,60,80,60,200])}catch(e){}
    if(H&&window.__fxF!==v.e&&typeof houseReveal==='function'){window.__fxF=v.e;setTimeout(()=>houseReveal(H,HN[H]),600)}
  }
}
function answer(v,c){
  if(V&&V.pz)return;const k=v.e+':'+v.qi;if(picked[k]!=null)return;picked[k]=c;
  try{navigator.vibrate&&navigator.vibrate(30)}catch(e){}
  room.presence({a:{e:v.e,q:v.qi,c,ms:Math.round(TIME-Math.max(0,deadline-Date.now()))}}).catch(()=>{});
  pkey='';playRender(v);
}

/* ================= связь: публичный MQTT-брокер ================= */
const BROKERS=['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt'];
const qs=new URLSearchParams(location.search);
let CODE=(qs.get('g')||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8);
let BI=Math.min(BROKERS.length-1,Math.max(0,parseInt(qs.get('b')||'0',10)||0));
if(qs.get('broker'))BROKERS.unshift(qs.get('broker'));
function makeRoom(code,host,brokerUrl){
  const T='hpq3/'+code;const pres={};let my={},state=null;
  const handlers={},peerH=[],connH=[];let connected=false;
  const client=mqtt.connect(brokerUrl,{clientId:'hpq_'+Math.random().toString(16).slice(2,10),keepalive:20,reconnectPeriod:2000,connectTimeout:8000,clean:true});
  client.on('connect',()=>{connected=true;connH.forEach(f=>f(true));client.subscribe(T+'/s');if(host)client.subscribe(T+'/p/+');if(Object.keys(my).length)pub()});
  client.on('close',()=>{if(connected){connected=false;connH.forEach(f=>f(false))}});
  client.on('offline',()=>{connected=false;connH.forEach(f=>f(false))});
  client.on('message',(topic,buf)=>{
    let d=null;try{d=buf.length?JSON.parse(buf.toString()):null}catch(e){return}
    if(topic===T+'/s'){if(d)(handlers.state||[]).forEach(f=>f({data:d}));return}
    const pid=topic.slice((T+'/p/').length);
    if(!d)delete pres[pid];else pres[pid]={...d,_seen:Date.now()};
    firePeers();
  });
  function pub(){my.t=Date.now();client.publish(T+'/p/'+PID,JSON.stringify(my),{retain:true,qos:0})}
  function list(){const now=Date.now();return Object.entries(pres).filter(([k,v])=>now-Math.max(v.t||0,0)<16000||now-v._seen<16000&&now-(v.t||0)<60000).map(([k,v])=>({peer:k,kind:'viewer',sameTab:false,presence:v}))}
  let pT=null;function firePeers(){if(pT)return;pT=setTimeout(()=>{pT=null;const ps=list();peerH.forEach(f=>f({peers:ps}))},120)}
  if(!host)setInterval(()=>{if(connected&&my.pid)pub()},5000);
  if(host)setInterval(firePeers,3000);
  addEventListener('pagehide',()=>{try{if(!host&&my.pid)client.publish(T+'/p/'+PID,'',{retain:true})}catch(e){}});
  return {
    peers:list,onPeers(f){peerH.push(f);return()=>{}},
    on(t,f){(handlers[t]=handlers[t]||[]).push(f);return()=>{}},
    async emit(t,d){if(t==='state'&&connected)client.publish(T+'/s',JSON.stringify(d),{retain:true,qos:0})},
    async presence(p){for(const k in p){if(p[k]===null)delete my[k];else my[k]=p[k]}if(connected)pub()},
    onConnection(f){connH.push(f);setTimeout(()=>f(connected),0);return()=>{}},connected:()=>connected,
    get ok(){return connected},
    clear(pids){for(const id of pids){try{client.publish(T+'/p/'+id,'',{retain:true})}catch(e){}delete pres[id]}firePeers()}
  };
}
function newCode(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let c='';const r=crypto.getRandomValues(new Uint8Array(6));for(const x of r)c+=A[x%A.length];return c}
function base(){return location.origin+location.pathname}

/* ================= старт ================= */
function landing(){
  app.innerHTML=`<div class="msg"><div><h1>Квиз по <em>Гарри Поттеру</em></h1>
  <p class="muted" style="font-size:18px">Открой главный экран на компьютере или телевизоре.<br>Игроки зайдут с телефонов по QR-коду, без регистрации.</p>
  <div class="choose"><button class="btn" id="goS">Открыть главный экран</button></div>
  <p class="muted" style="margin-top:28px">Ты игрок? Отсканируй QR-код на большом экране.</p></div></div>`;
  document.getElementById('goS').onclick=()=>{location.href=base()+'?screen=1'};
}
function connectWait(r,cb){let done=false;r.onConnection(c=>{if(c&&!done){done=true;cb(true)}});setTimeout(()=>{if(!done){done=true;cb(false)}},9000)}
function startHost(){
  isHost=true;try{import('./fx3d.js?v=18').catch(e=>console.warn(e))}catch(e){}
  let code=null;try{code=localStorage.getItem('hpq-host-code')}catch(e){}
  if(!code){code=newCode();try{localStorage.setItem('hpq-host-code',code)}catch(e){}}
  CODE=code;
  app.innerHTML='<div class="msg"><div><h1>Квиз по <em>Гарри Поттеру</em></h1><p class="muted">Подключаемся…</p></div></div>';
  const tryB=i=>{
    room=makeRoom(CODE,true,BROKERS[i]);
    connectWait(room,ok=>{
      if(!ok&&i+1<BROKERS.length){tryB(i+1);return}
      if(!ok){app.innerHTML='<div class="msg"><div><h1>Нет связи</h1><p class="muted">Не удалось подключиться к серверу игры. Проверь интернет и обнови страницу.</p></div></div>';return}
      BI=i;LINK=base()+'?g='+CODE+(i?'&b='+i:'');
      try{const saved=JSON.parse(localStorage.getItem('hpq-host-game')||'null');if(saved&&saved.code===CODE&&Date.now()-saved.at<6*3600e3){Object.assign(G,saved.g);G.timer=null;if(G.ph==='question'){G.ph='board'}}}catch(e){}
      mode='screen';screenShell();hostStart();
    });
  };
  tryB(BI);
}
function startPlayer(){
  mode='play';try{import('./fx3d.js?v=18').catch(e=>console.warn(e))}catch(e){}
  app.innerHTML='<div class="msg"><div><h1>Квиз по <em>Гарри Поттеру</em></h1><p class="muted">Подключаемся к Большому залу…</p></div></div>';
  room=makeRoom(CODE,false,BROKERS[BI]);
  room.on('state',msg=>{if(mode==='play'){hostSeen=true;onState(msg.data)}});
  connectWait(room,ok=>{
    if(!ok){app.innerHTML='<div class="msg"><div><h1>Нет связи</h1><p class="muted">Не получается подключиться. Проверь интернет и обнови страницу.</p></div></div>';return}
    playShell();
  });
}
(()=>{
  if(typeof mqtt==='undefined'){app.innerHTML='<div class="msg"><div><h1>Ошибка загрузки</h1><p class="muted">Обнови страницу.</p></div></div>';return}
  if(qs.get('screen'))startHost();else if(CODE)startPlayer();else landing();
})();
}
